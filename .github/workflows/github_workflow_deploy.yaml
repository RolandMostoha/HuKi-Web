name: Deploy HuKi-Web to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy static site to S3 bucket
        run: aws s3 sync ./ s3://huki-customresourcestack-12f0c5ticc0l-s3bucketroot-nw0cariy0rdj --delete

      # Both files must be served as application/json or the OS link verifiers reject them.
      # apple-app-site-association has no extension, so S3 guesses binary/octet-stream;
      # assetlinks.json is re-uploaded here too so the type is pinned explicitly rather
      # than left to S3's guess. This replaces setting the type by hand after each deploy.
      - name: Fix content type of app link association files
        run: |
          for file in apple-app-site-association assetlinks.json; do
            aws s3 cp ".well-known/$file" \
              "s3://huki-customresourcestack-12f0c5ticc0l-s3bucketroot-nw0cariy0rdj/.well-known/$file" \
              --content-type application/json
          done
